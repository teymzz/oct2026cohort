<script>

    // string, number, boolean, symbol, undefined, null, array, object, function

    // primitive data types 

    // data-type: number 
    let num1 = 1234

   // data-type: string
   let name1 = 'ade'
   let name2 = "ade"
   let name3 = `ade`
   let num2 = '1234'

   // data-type: boolean
   let boolean1 = true;
   let boolean2 = false;

   // symbol
   let symbol1 = Symbol('id')
   let symbol2 = Symbol('id')

   //undefined 
   let myvariable = undefined

   let nullValue = null; 

   // Non-primitive data types 

   // array 
   let values = [1, 2, [], 'ade']

   // object 
   let list = { name: 'ade', age: 20, data: [] }

   console.log(typeof '');
   console.log(typeof 123);
   console.log(typeof true);
   console.log(typeof symbol1);
   console.log(typeof {});
   console.log(typeof []);
   
</script>
