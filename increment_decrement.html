<script>    
    let num1  = 10; 
    num1 += 1;

    // increment before
    let num2 =  10; 
    let increase = ++num2  

    console.log(increase, num2);

    // increment after
    let num3 = 10; 
    num3++  // 10
    console.log(num3); // 11


    let num4 = 15; 

    console.log(num4++)   // 15
    console.log(num4++) // 16
    console.log(++num4) // 18
    console.log(num4) // 18

    let num5 = 12;

    console.log(num5++)  // 12
    console.log(++num5) // 14
    console.log(++num5) // 15
    console.log(num5++) // 15
    console.log(num5) // 16 

    // Decrement Operator -- 

    let num6 =  10;

    console.log(--num6); // 9
    console.log(num6); // 9
    
    let num7 =  10;
    console.log(num7--); // 10
    console.log(num7); // 9
