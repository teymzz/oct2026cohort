<script>

function checkSeason() {

    /// DeCemBEr // december

 let monthInput = month.value.trim()
 let monthValue = monthInput.toLowerCase(); 

 if(monthValue){

    if(monthValue === 'september' || monthValue === 'october' || monthValue === 'november'){
        output.innerHTML = monthInput+' is Autumn'
    }else if(monthValue === 'december' || monthValue === 'january' || monthValue === 'february'){
        output.innerHTML = monthInput+' is Winter'
    }else if(monthValue === 'march' || monthValue === 'april' || monthValue === 'may'){
        output.innerHTML = monthInput+' is Spring'
    }else if(monthValue === 'june' || monthValue === 'july' || monthValue === 'august'){
        output.innerHTML = monthValue+'Seaon is Summer'
    }else{
        output.innerHTML = `"${monthInput} is not a valid month"`
    }

 }else{
    alert('Please supply enter a valid input')
 }

}
