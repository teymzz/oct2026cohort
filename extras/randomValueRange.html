<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" id="num1">
    <input type="text" id="num2">
    <button onclick="generateNumber()">submit</button>
    <div id="output"></div>
    
</body>
<script>

    function generateNumber() {
        let numField1 = document.getElementById('num1');
        let numField2 = document.getElementById('num2');

        let outputField = document.getElementById('output');

        let num1 = +numField1.value
        let num2 = +numField2.value

        let randomNumber = Math.random() * (num2 - num1); // 0 -- max 
        randomNumber = randomNumber + num1 // 
        randomNumber = Math.ceil(randomNumber)

        outputField.innerHTML = randomNumber;

        
    }

</script>
</html>
