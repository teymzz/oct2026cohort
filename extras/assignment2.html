<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Censor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, #eef2f7 0%, #dfe6f0 100%);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 28px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(30, 41, 59, 0.08), 0 2px 6px rgba(30, 41, 59, 0.05);
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 14px 16px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            color: #1e293b;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        textarea:focus {
            background: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        button {
            align-self: flex-end;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #ffffff;
            background: #4f46e5;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background: #4338ca;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: 3px solid rgba(79, 70, 229, 0.4);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <div class="card">
        <small class="">Word censor application (stupid, crazy, idiot, imbecile)</small>
        <textarea name="" id="textareaField" placeholder="Type or paste your text here..."></textarea>
        <button onclick="censorWord()">Censor</button>

        <div id="output"></div>
    </div>

</body>
</html>

<script>

// vulgar words
let word1 = 'stupid'
let word2 = 'idiot'
let word3 = 'crazy'
let word4 = 'imbecile'

let textareaField = document.getElementById('textareaField'); //  

function censorWord() {

    let userSentence = textareaField.value

    // "He is a stupid kid and he is also an idiot";

    userSentence = userSentence.replaceAll('stupid', 'stup*d') // He is a stup*d kid and he is also an idiot
    userSentence = userSentence.replaceAll('idiot', 'id*ot') // He is a stup*d kid and he is also an 'id*ot
    userSentence = userSentence.replaceAll('crazy', 'crz*y')
    userSentence = userSentence.replaceAll('imbecile', 'imbec*le');
    
    let outputField = document.getElementById('output');

    outputField.innerHTML = userSentence;
}


</script>
