<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .time-tables {
            padding: 10px;
            background-color: blue;
            margin-bottom: 20px;
            color: white;
        }
    </style>
</head>
<body>
    
    <input type="text" id="number1">
    <input type="text" id="number2">
    <button onclick="generateTimesTable()">Generate Times Table</button>

    <div id="output"></div>

</body>
 </html>
<script>

    // console.log( !true );  // false
    // console.log( !'' );  // true
    // console.log( !' ' );  // false
    

function generateTimesTable(){
    
    // First field element and value
    let startField = document.getElementById('number1')
    let startValue = startField.value.trim() ;  // 'ade'

    // Second field element and value
    let stopField = document.getElementById('number2')
    let stopValue = stopField.value.trim(); // 'bola'

    if( !startValue || !stopValue ){
        alert('All fields are required.')
    }else{

        if( isNaN(startValue) ) {
            alert('Please enter a valid number in the first input field')
        }else if(  isNaN(stopValue)  ){
            alert('Please enter a valid number in the second input field')
        }else{
            startValue = +startValue // starting number 
            stopValue = +stopValue // ending number

            let html = '';

            for(let index = startValue; index <= stopValue; index++){
                
                // output.innerHTML += `<h1>${index} times multiplication table</h1>`

                // for(let multiplier = 0; multiplier <= 12; multiplier++){
                //     output.innerHTML += `${index} * ${multiplier} = ${index * multiplier} <br>`;
                // }

                // output.innerHTML += '<br>'

                html += `<div class="time-tables"><h1>${index} times multiplication table</h1>`

                for(let multiplier = 0; multiplier <= 12; multiplier++){
                    html += `${index} * ${multiplier} = ${index * multiplier} <br>`;
                }

                html += '</div>'
                                
            }

            output.innerHTML = html

        }

    }

    

}


</script>
