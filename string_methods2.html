<script>
// trimStart/ trimLeft ...........................................
let string1 = '            This is my     friend    ';

console.log(string1);

console.log(string1.trimLeft());


// trimRight/ trimEnd ...........................................
console.log(string1.trimRight());

// trim ...........................................
console.log(string1.trim());

let string2 = 'I have a book';

console.log(string2.includes('I')); // true
console.log(string2.includes('i')); // false

console.log(string2.includes(' book')); // true

// search 

console.log(string2.search('a'));

// match 
console.log(string2.match('books'));
</script>
